name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # node --check, node --test, RU/EN parity, critical CSS, static twins.
      # NO_BUILD=1: the script bundles Functions with `npx --offline`, which has
      # no cache on a fresh runner — the next step bundles them online instead.
      - run: NO_BUILD=1 bash scripts/check.sh
      - name: Bundle Functions the way Pages does
        run: npx --yes wrangler@4 pages functions build --outdir "$RUNNER_TEMP/fnbuild"

  # Private repos on the free plan get no GitHub secret scanning; gitleaks
  # scans the whole history instead.
  secrets:
    name: secrets
    # The action lists the PR's commits through the API; the default token
    # cannot read pull requests.
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
