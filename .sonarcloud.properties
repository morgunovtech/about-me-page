# SonarQube Cloud automatic analysis (no scanner in CI).
#
# Copy-paste detection skips the HTML page templates: the site has no build
# step and no includes (CLAUDE.md, «No build tools»), so every page carries the
# same <head> (critical CSS, preloads, theme script), bar and footer by design.
# Those twins are kept identical by scripts/check-sync.py, check-critical.py and
# tests/composition.test.mjs, not by Sonar. The templates are still analysed for
# bugs and security issues; only duplication is not counted.
#
# ds/v1/chrome.js is generated: script.js without its site-only regions, for
# the family services (scripts/build-chrome.mjs; check.sh fails on drift). Every
# change to the shared part of script.js lands in both files, so it would count
# twice as new duplicated code; the twin is checked by build-chrome --check.
sonar.cpd.exclusions=**/*.html,ds/v1/chrome.js
