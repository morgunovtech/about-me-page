    .h1    { font-size: 130px; font-weight: 700; fill: #14110d; }
    .meta  { font-size: 16px; font-weight: 600; fill: #14110d; letter-spacing: 2px; }
    .meta-dim { font-size: 16px; font-weight: 500; fill: #5a554c; letter-spacing: 2px; }
    .num   { font-size: 18px; font-weight: 600; fill: #d9531e; letter-spacing: 2px; }
    .role  { font-size: 22px; font-weight: 600; fill: #14110d; letter-spacing: 2px; }
    .sub   { font-size: 16px; font-weight: 500; fill: #5a554c; letter-spacing: 2px; }
    .url   { font-size: 14px; font-weight: 500; fill: #807a6e; letter-spacing: 2px; }
  </style>

  <rect width="1200" height="630" fill="#edeae5"/>

  <line x1="64" y1="80" x2="1136" y2="80" stroke="#14110d" stroke-width="1"/>
  <text x="64" y="56" class="mono meta">MORGUNOV.TECH</text>
  <text x="1136" y="56" text-anchor="end" class="mono meta-dim">PERSONAL · 2026</text>

