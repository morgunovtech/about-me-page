# Cloudflare Pages config — bindings only. No build step (static site served as-is).
# Functions in /functions are bundled automatically by Pages on deploy.
name = "about-me-page"
pages_build_output_dir = "."
compatibility_date = "2024-11-01"

# Content store. The `id` is used only for remote deploys; `wrangler pages dev`
# simulates KV locally and ignores it. Replace the placeholder with the real
# namespace id after `wrangler kv namespace create CONTENT`, or bind it in the
# Cloudflare Pages dashboard (Settings → Functions → KV namespace bindings).
[[kv_namespaces]]
binding = "CONTENT"
id = "588ef476ce534bb48734fe562178080a"

# Image/asset storage (R2). bucket_name is used on deploy; `wrangler pages dev`
# simulates R2 locally. Create with: wrangler r2 bucket create morgunov-assets
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "morgunov-assets"
